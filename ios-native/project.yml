name: OurRecipe
options:
  bundleIdPrefix: com.hyeji
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ko
settings:
  base:
    SWIFT_VERSION: "5.0"
    # 기존 App Store 앱(Capacitor 1.2 / build 26)을 대체하는 네이티브 앱이라 번들 ID·팀을 그대로 쓴다.
    # 주의: 실제 번들 ID 는 `ourhomemenu` 이다 (capacitor.config.ts 의 com.hyeji.ourmenu 는 URL 스킴/appId 표기일 뿐)
    DEVELOPMENT_TEAM: 6NTUXY85FS
    MARKETING_VERSION: "2.0.0"
    CURRENT_PROJECT_VERSION: "29"
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 11.5.0
targets:
  OurRecipe:
    type: application
    platform: iOS
    sources:
      - OurRecipe
      # 메뉴판 카드용 폰트는 웹과 같은 파일을 그대로 참조한다 (저장소에 같은 바이너리를 두 번 두지 않는다)
      - path: ../src/fonts
        includes:
          - griun-noltotaenggu.ttf
          - hs-hwalkongserif.ttf
          - memoment-kkukkukk.ttf
          - chosun-gs.ttf
          - chosun-sm.ttf
        buildPhase: resources
      # 푸시(FCM) 설정: 기존 앱과 같은 Firebase 프로젝트 (BUNDLE_ID = ourhomemenu)
      - path: ../ios/App/App/GoogleService-Info.plist
        buildPhase: resources
    dependencies:
      - package: Firebase
        product: FirebaseMessaging
      - target: ShareExtension
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    entitlements:
      path: OurRecipe/OurRecipe.entitlements
      properties:
        aps-environment: development
        keychain-access-groups:
          - $(AppIdentifierPrefix)ourhomemenu
        com.apple.developer.associated-domains:
          - applinks:ourhomemenu.vercel.app
    info:
      path: OurRecipe/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: com.hyeji.ourmenu.auth
            CFBundleURLSchemes:
              - com.hyeji.ourmenu
        # Config/*.xcconfig 의 값이 들어온다 (비어 있으면 앱은 게스트(로컬) 모드로만 동작)
        SupabaseURL: $(SUPABASE_URL)
        SupabaseAnonKey: $(SUPABASE_ANON_KEY)
        ApiBaseURL: $(API_BASE_URL)
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes:
          - remote-notification
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ourhomemenu
        # 파일 이름은 ASCII 로 (한글 .app 이름은 App Store 클라우드 서명에서 문제가 됐다). 홈 화면 이름은 아래 DisplayName 이 정한다
        PRODUCT_NAME: OurRecipe
        PRODUCT_MODULE_NAME: OurRecipe
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: 우리집 레시피
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: 메뉴판 이미지를 사진에 저장해요
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        # 기존 앱과 같은 유니버설 앱이라 아이패드 멀티태스킹 규칙에 맞게 네 방향을 모두 지원한다 (아이폰은 세로 고정)
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.food-and-drink
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  ShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - ShareExtension
      # 앱과 같은 서버 접근 코드를 그대로 쓴다
      - OurRecipe/Backend/Config.swift
      - OurRecipe/Backend/Keychain.swift
      - OurRecipe/Backend/JSONValue.swift
      - OurRecipe/Backend/Backend.swift
      - OurRecipe/Backend/AssistantAPI.swift
      - OurRecipe/Backend/SharedLink.swift
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    entitlements:
      path: ShareExtension/ShareExtension.entitlements
      properties:
        # 앱과 같은 키체인 그룹 → 앱의 로그인 세션을 확장에서 그대로 쓴다
        keychain-access-groups:
          - $(AppIdentifierPrefix)ourhomemenu
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: 우리집 레시피
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsWebPageWithMaxCount: 1
              NSExtensionActivationSupportsText: true
        SupabaseURL: $(SUPABASE_URL)
        SupabaseAnonKey: $(SUPABASE_ANON_KEY)
        ApiBaseURL: $(API_BASE_URL)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ourhomemenu.ShareExtension
        PRODUCT_NAME: ShareExtension
        GENERATE_INFOPLIST_FILE: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
  OurRecipeTests:
    type: bundle.unit-test
    platform: iOS
    sources: [OurRecipeTests]
    dependencies:
      - target: OurRecipe
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: ourhomemenu.tests
        # 앱 실행 파일 경로를 직접 지정한다
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/OurRecipe.app/OurRecipe"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  OurRecipe:
    build:
      targets:
        OurRecipe: all
    test:
      targets: [OurRecipeTests]
