name: OurRecipe
options:
  bundleIdPrefix: com.hyeji
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ko
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  OurRecipe:
    type: application
    platform: iOS
    sources:
      - OurRecipe
      # 메뉴판 카드용 폰트는 웹과 같은 파일을 그대로 참조한다 (저장소에 같은 바이너리를 두 번 두지 않는다)
      - path: ../src/fonts
        includes:
          - griun-noltotaenggu.ttf
          - hs-hwalkongserif.ttf
          - memoment-kkukkukk.ttf
          - chosun-gs.ttf
          - chosun-sm.ttf
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hyeji.ourrecipe.native
        PRODUCT_NAME: 우리집 레시피
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: 우리집 레시피
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: 메뉴판 이미지를 사진에 저장해요
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
